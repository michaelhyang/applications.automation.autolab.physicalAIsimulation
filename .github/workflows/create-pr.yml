name: Auto Create, Check, and Merge PR

on:
  push:
    branches-ignore:
      - main

jobs:
  auto-pr-process:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Process PR
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          # 1. Find or create PR for this branch
          echo "Checking for existing PR..."
          PR_URL=$(gh pr view "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --json url -q '.url' 2>/dev/null || true)

          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr list \
              --repo "${{ github.repository }}" \
              --base "${{ github.event.repository.default_branch || 'master' }}" \
              --head "${{ github.ref_name }}" \
              --state open \
              --json url -q '.[0].url' 2>/dev/null || true)
          fi

          if [ -n "$PR_URL" ]; then
            echo "Found existing PR at $PR_URL"
          else
            echo "Creating PR..."
            PR_URL=$(gh pr create \
              --title "Automated PR: ${{ github.ref_name }}" \
              --body "Auto-created, CI checked, and merged by GitHub Actions." \
              --base "${{ github.event.repository.default_branch || 'master' }}" \
              --head "${{ github.repository_owner }}:${{ github.ref_name }}" \
              --repo "${{ github.repository }}")
            echo "PR created at $PR_URL"
          fi

          # 2. Wait for CI checks to pass
          # --watch polls until all checks pass or timeout
          # --interval sets the polling interval (seconds)
          echo "Waiting for CI checks to pass..."
          if gh pr checks "$PR_URL" --watch --interval 10; then
            echo "CI checks passed. Proceeding to merge."

            # 3. Merge the PR
            gh pr merge "$PR_URL" --merge --auto-delete-branch
          else
            echo "CI checks failed or timed out. Merge aborted."
            exit 1
          fi
